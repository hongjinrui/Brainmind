name: BRZ editor tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/Brainmind.7z.*
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Check CLI entry point
        run: python -X utf8 -m brain_toolkit --help
