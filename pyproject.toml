[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brainmind-toolkit"
version = "0.1.0"
description = "Experimental, conservative editor for the supplied TheBrain v5 BRZ exports"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
brainmind = "brain_toolkit.__main__:main"

[tool.setuptools.packages.find]
include = ["brain_toolkit*"]
