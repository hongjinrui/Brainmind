[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brainmind-toolkit"
version = "0.2.0"
description = "Create TheBrain v5 BRZ files from content and conservatively edit existing exports"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
brainmind = "brain_toolkit.__main__:main"

[tool.setuptools.packages.find]
include = ["brain_toolkit*"]
